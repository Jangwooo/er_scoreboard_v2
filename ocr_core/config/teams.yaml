# 팀 별칭 표. 같은 팀이 화면마다 세 가지 형태로 나옵니다.
#   name_ko: 대기 화면의 한글 정식명
#   name_en: 인게임 패널의 영문명. 잘려서 나오는 팀은 화면에 보이는 앞부분만 적습니다
#   code:    리더보드의 3글자 코드 (id 로도 씀)
# 그 밖의 표기는 aliases 에 넣습니다.
#
# 2026 KEL CIRCUIT 3 샘플에서 옮겼습니다. 코드와 팀 이름의 대응은 같은 경기의
# 패널 이름과 리더보드 코드를 맞춰 본 추정입니다(예: GSL = GJ Slasher, YJS = YJ Whales).
# NRG, GIN, JSD, BS 는 집계 화면에서 코드만 확인했습니다.
teams:
  - {id: FN, code: FN, name_en: "FN SEJONG", name_ko: "FN 세종", aliases: []}
  - {id: GSL, code: GSL, name_en: "GJ Slasher", name_ko: "광주 슬래셔", aliases: []}
  - {id: GBA, code: GBA, name_en: "Gyeongbuk Ascen", name_ko: "경북 어센더스", aliases: []}
  - {id: DG, code: DG, name_en: "Daegu Guardians", name_ko: "대구 가디언즈", aliases: []}
  - {id: YJS, code: YJS, name_en: "YJ Whales", name_ko: "양주 웨일즈", aliases: []}
  - {id: INW, code: INW, name_en: "INCHEON WAVE", name_ko: "인천 웨이브", aliases: []}
  - {id: MIR, code: MIR, name_en: "Goyang Mir", name_ko: "고양 미르", aliases: []}
  - {id: GNS, code: GNS, name_en: "Gyeongnam Spark", name_ko: "경남 스파클 이스포츠", aliases: []}
  - {id: NRG, code: NRG, name_en: "", name_ko: "", aliases: []}
  - {id: GIN, code: GIN, name_en: "", name_ko: "", aliases: []}
  - {id: JSD, code: JSD, name_en: "", name_ko: "", aliases: []}
  - {id: BS, code: BS, name_en: "", name_ko: "", aliases: []}
