# OCR 코어 레이아웃 설정.
# 좌표는 모두 1920x1080으로 정규화한 프레임 기준 [x, y, w, h] 입니다.
# 대회 오버레이가 바뀌면 코드는 그대로 두고 이 파일만 고칩니다.
#
# 2026 KEL CIRCUIT 3 중계(유튜브) 샘플 4장으로 보정했습니다.
# 폰 스크린샷(3120x1440)은 영상 영역이 crop [280, 0, 2560, 1440] 입니다.
calibrated: true

frame:
  width: 1920
  height: 1080

tesseract:
  backend: lib          # lib: libtesseract 엔진을 스레드마다 띄워 두고 재사용 / cli: 호출마다 프로세스 실행
  cmd: tesseract        # backend: cli 일 때만 씀
  lang: eng
  timeout: 10.0

stream:
  fps: 1                # 스트림에서 초당 몇 장을 읽을지. 라이브에서 OCR 이 밀리면 오래된 프레임은 버림
  ytdlp_format: 'bv*[height<=1080]/b'   # 유튜브 링크일 때 yt-dlp 형식 선택
  ffmpeg: ffmpeg

ocr:
  workers: 4            # 필드를 병렬로 읽는 스레드 수. backend: lib 이면 스레드마다 tesseract 엔진 하나
  cache_size: 4096      # 같은 바이트의 크롭은 다시 읽지 않음
  min_confidence: 0.4   # 이보다 낮으면 자동 반영하지 않고 관리자 확인으로 넘김

# 숫자 칸의 형식. 형식에 맞지 않는 읽기 결과는 오인식으로 보고 버립니다.
number_kinds:
  decimal:              # 소수점이 항상 있는 칸 (TS/KS, 집계표). 점수는 0.5 단위
    pattern: '\d{1,3}\.[05]'
    max: 300
  score:                # 정수 또는 .5 (인게임 리더보드 누적 점수)
    pattern: '\d{1,3}(\.5)?'
    max: 500

teams:
  min_score: 0.6        # 팀 이름 퍼지 매칭 최소 유사도

# 화면 분류: 화면마다 고정 요소(probe)를 검사해 통과 비율이 가장 높은 화면을 고릅니다.
# check: color    → 박스 안에서 HSV 범위에 드는 픽셀 비율이 min_fraction 이상
# check: template → 박스 안에서 템플릿 매칭 점수가 threshold 이상 (경로는 이 파일 기준)
classifier:
  min_score: 0.75
  screens:
    waiting:            # 좌상단 흰색 NEXT 박스와 그 오른쪽 검은 라운드 박스
      probes:
        - {name: next_box, check: color, box: [40, 35, 90, 50], hsv_low: [0, 0, 200], hsv_high: [180, 40, 255], min_fraction: 0.5}
        - {name: round_box_top, check: color, box: [160, 30, 320, 6], hsv_low: [0, 0, 0], hsv_high: [180, 255, 30], min_fraction: 0.8}
    camera:             # 하단 남색 패널과 그 위 하늘색 선
      probes:
        - {name: cyan_line, check: color, box: [300, 738, 1300, 3], hsv_low: [80, 150, 180], hsv_high: [100, 255, 255], min_fraction: 0.8}
        - {name: navy_panel, check: color, box: [300, 750, 1300, 40], hsv_low: [104, 150, 100], hsv_high: [114, 200, 160], min_fraction: 0.8}
    ingame:             # 우상단 하늘색 "KEL CIRCUIT" 바, 우하단 검은 LEADERBOARD
      probes:
        - {name: kel_bar, check: color, box: [1350, 16, 120, 22], hsv_low: [85, 150, 120], hsv_high: [100, 255, 255], min_fraction: 0.6}
        - {name: leaderboard_black, check: color, box: [1540, 872, 55, 190], hsv_low: [0, 0, 0], hsv_high: [180, 60, 35], min_fraction: 0.9}
    results:            # 좌측 검은 패널, 밝은 집계표 행
      probes:
        - {name: left_panel, check: color, box: [30, 180, 380, 250], hsv_low: [0, 0, 0], hsv_high: [180, 255, 25], min_fraction: 0.95}
        - {name: table_row, check: color, box: [700, 180, 180, 20], hsv_low: [0, 0, 220], hsv_high: [180, 40, 255], min_fraction: 0.8}

ingame:
  round_box: [1590, 12, 325, 34]   # "LOWER MATCH | ROUND 6"
  round_pattern: 'ROUND\s*(\d+)'   # LOWER GROUP / MATCH / FINALS 표기는 무시하고 숫자만 씀
  slots:
    count: 8
    origin_x: 10        # 01번 슬롯 왼쪽 x
    pitch_x: 178        # 슬롯 간격. 가로 슬롯은 고정이고 점수순이 아님
    # 패널 y = 팀 색 강조선의 윗변. 관전 중인 팀 패널만 30px 위로 올라옵니다.
    y_candidates: [874, 844]
    # 강조선은 팀마다 색이 달라서 색 대신 "밝은 선 - 바로 아래 어두운 패널"의 밝기 차이로 찾습니다.
    anchor:
      strip: [30, 0, 140, 3]
      body: [30, 5, 140, 4]
    fields:             # 패널 기준 상대 좌표
      # "TS 5.0 KS 4.0" 줄. 오른쪽 정렬이라 값 위치가 길이에 따라 바뀌므로,
      # 흰 값(밝기 >= value_min)과 회색 라벨을 밝기로 나눠 오른쪽 두 덩어리를 TS, KS로 읽습니다.
      tsks: {box: [35, -19, 140, 16], kind: decimal, value_min: 170, merge_gap: 5}
      name: {box: [35, 7, 140, 19]}
      skull: {box: [0, 30, 174, 32], template: templates/skull.png, threshold: 0.80}
  leaderboard:          # 직전 라운드까지의 누적 점수. 라운드 종료 때만 갱신됨
    rows: 8
    origin: [1440, 868]
    row_height: 25
    code_box: [36, 2, 60, 21]
    score_box: [162, 2, 46, 21]
    score_kind: score

results:                # 라운드 종료 집계 화면. 확정값
  rows: 8
  origin: [500, 175]
  row_height: 101
  name_box: [190, 28, 110, 46]
  columns:
    - {name: total_fk, box: [395, 28, 105, 46], kind: decimal}
    - {name: total_points, box: [515, 28, 110, 46], kind: decimal}
