# OCR 코어 레이아웃 설정.
# 좌표는 모두 1920x1080으로 정규화한 프레임 기준 [x, y, w, h] 입니다.
# 대회 오버레이가 바뀌면 코드는 그대로 두고 이 파일만 고칩니다.
#
# 주의: 아래 좌표와 색상 범위는 아직 실제 중계 프레임으로 보정하지 않은 자리표시 값입니다.
# scripts/draw_layout.py 로 실제 프레임 위에 박스를 그려 맞춘 뒤 calibrated 를 true 로 바꾸세요.
calibrated: false

frame:
  width: 1920
  height: 1080

tesseract:
  cmd: tesseract
  lang: eng
  timeout: 10.0

ocr:
  workers: 4            # 필드를 병렬로 읽는 스레드 수
  cache_size: 4096      # 같은 바이트의 크롭은 다시 읽지 않음
  min_confidence: 0.4   # 이보다 낮으면 자동 반영하지 않고 관리자 확인으로 넘김

# 숫자 칸의 형식. 형식에 맞지 않는 읽기 결과는 오인식으로 보고 버립니다.
number_kinds:
  decimal:              # 소수점이 항상 있는 칸 (TS/KS, 집계표). 점수는 0.5 단위
    pattern: '\d{1,3}\.[05]'
    max: 300
  score:                # 정수 또는 .5 (인게임 리더보드 누적 점수)
    pattern: '\d{1,3}(\.5)?'
    max: 500

teams:
  min_score: 0.6        # 팀 이름 퍼지 매칭 최소 유사도

# 화면 분류: 화면마다 고정 요소(probe)를 검사해 통과 비율이 가장 높은 화면을 고릅니다.
# check: color    → 박스 안에서 HSV 범위에 드는 픽셀 비율이 min_fraction 이상
# check: template → 박스 안에서 템플릿 매칭 점수가 threshold 이상 (경로는 이 파일 기준)
classifier:
  min_score: 0.75
  screens:
    waiting:            # 좌상단 흰색 NEXT 박스, 상단 바
      probes:
        - {name: next_box, check: color, box: [40, 40, 240, 80], hsv_low: [0, 0, 200], hsv_high: [180, 40, 255], min_fraction: 0.6}
        - {name: top_bar, check: color, box: [400, 0, 1120, 8], hsv_low: [80, 120, 120], hsv_high: [100, 255, 255], min_fraction: 0.6}
    camera:             # HUD 없음, 하단 로고와 스폰서 배너
      probes:
        - {name: sponsor_banner, check: color, box: [0, 1010, 1920, 70], hsv_low: [0, 0, 200], hsv_high: [180, 40, 255], min_fraction: 0.5}
    ingame:             # 우상단 "... | ROUND m" 바, 우하단 LEADERBOARD
      probes:
        - {name: round_bar_strip, check: color, box: [1400, 66, 500, 4], hsv_low: [80, 120, 120], hsv_high: [100, 255, 255], min_fraction: 0.6}
        - {name: leaderboard_header, check: color, box: [1640, 380, 260, 30], hsv_low: [80, 120, 120], hsv_high: [100, 255, 255], min_fraction: 0.6}
    results:            # 좌측 큰 LEADERBOARD, 순위 점수표
      probes:
        - {name: leaderboard_header, check: color, box: [120, 120, 1100, 50], hsv_low: [130, 100, 100], hsv_high: [160, 255, 255], min_fraction: 0.6}

ingame:
  round_box: [1400, 20, 500, 44]
  round_pattern: 'ROUND\s*(\d+)'   # LOWER GROUP / MATCH / FINALS 표기는 무시하고 숫자만 씀
  slots:
    count: 8
    origin_x: 20        # 01번 슬롯 왼쪽 x
    pitch_x: 236        # 슬롯 간격. 가로 슬롯은 고정이고 점수순이 아님
    # 관전 중인 팀 패널만 위로 올라오므로 슬롯마다 세로 위치를 후보 중에서 고릅니다.
    y_candidates: [900, 840]
    anchor:             # 패널 위치를 찾는 기준 (패널 상단 강조선)
      box: [0, 0, 220, 6]
      hsv_low: [0, 0, 180]
      hsv_high: [180, 60, 255]
    fields:             # 패널 기준 상대 좌표
      ts: {box: [40, 10, 60, 30], kind: decimal}
      ks: {box: [140, 10, 60, 30], kind: decimal}
      name: {box: [0, 44, 220, 28]}
      skull: {box: [180, 76, 36, 36], template: templates/skull.png, threshold: 0.80}
  leaderboard:          # 직전 라운드까지의 누적 점수. 라운드 종료 때만 갱신됨
    rows: 8
    origin: [1640, 420]
    row_height: 48
    code_box: [0, 4, 90, 40]
    score_box: [170, 4, 90, 40]
    score_kind: score

results:                # 라운드 종료 집계 화면. 확정값
  rows: 8
  origin: [120, 200]
  row_height: 90
  name_box: [80, 10, 400, 60]
  # 집계표 숫자 칸. 칸 이름은 실제 화면을 보고 맞추세요.
  columns:
    - {name: round_score, box: [700, 10, 140, 60], kind: decimal}
    - {name: total_score, box: [900, 10, 140, 60], kind: decimal}
